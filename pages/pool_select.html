<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选择奖池</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Microsoft YaHei',sans-serif}
.stage{position:relative;width:2340px;height:1080px;transform-origin:top left;overflow:hidden}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
/* 武器浮动图层 - 在背景图上面，透明背景 */
.weapon-float{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;pointer-events:none;animation:weaponFloat 4s ease-in-out infinite}
@keyframes weaponFloat{0%,100%{transform:translateY(0px)}50%{transform:translateY(-13px)}}
/* 热区层 - 全屏接收点击 */
.hit-layer{position:absolute;top:0;left:0;width:100%;height:100%;cursor:pointer;z-index:10}
/* 选中的金色光晕 */
.gold-glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,0.55) 0%,rgba(255,215,0,0.25) 40%,rgba(255,215,0,0) 70%);pointer-events:none;display:none;animation:glowPulse 1.5s ease-in-out infinite;z-index:5}
@keyframes glowPulse{0%,100%{opacity:0.8;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}

/* 页面说明文字 */
.page-info{position:fixed;top:12px;left:12px;max-width:320px;background:rgba(0,0,0,.7);border:1px solid rgba(255,215,0,.3);border-radius:8px;padding:10px 14px;z-index:99998;font-size:12px;color:#ccc;line-height:1.6}
.page-info .title{font-size:14px;font-weight:bold;color:#ffd700;margin-bottom:6px}
.page-info .guide p{margin:2px 0}
.disclaimer-box{position:fixed;bottom:12px;left:12px;right:12px;background:rgba(0,0,0,.7);border:1px solid rgba(255,215,0,.3);border-radius:8px;padding:8px 14px;z-index:99998;font-size:11px;color:#999;line-height:1.5;text-align:center}
.fs-btn{position:fixed;top:12px;right:12px;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid rgba(255,215,0,.5);color:#ffd700;font-size:26px;cursor:pointer;z-index:99999;display:flex;align-items:center;justify-content:center;transition:all .2s}
.bgm-volume-control{position:fixed;top:72px;right:12px;width:32px;height:120px;background:rgba(0,0,0,.65);border:1px solid rgba(255,215,0,.4);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 0;z-index:99999;transition:all .2s}
.bgm-volume-icon{font-size:14px;margin-bottom:6px;flex-shrink:0}
.bgm-volume-slider{-webkit-appearance:none;appearance:none;width:80px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;cursor:pointer;transform:rotate(-90deg);transform-origin:center center;margin-top:30px}
.bgm-volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#ffd700;cursor:pointer;border:2px solid #fff;box-shadow:0 0 4px rgba(255,215,0,.6)}
.bgm-volume-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#ffd700;cursor:pointer;border:2px solid #fff;box-shadow:0 0 4px rgba(255,215,0,.6)}
:fullscreen .fs-btn, :fullscreen .bgm-volume-control,
:-webkit-full-screen .fs-btn, :-webkit-full-screen .bgm-volume-control{display:none !important}
</style>
</head>
<body>
<!-- 页面说明文字 -->
<div class="page-info">
  <div class="title">🎮 抽奖模拟器操作指南</div>
  <div class="guide">
    <p>1. 手机开启自动旋转，点击右上角全屏按钮横屏使用。</p>
    <p>2. 点击武器图标选择想要的奖池，选中后会显示金色光晕。点击底部"确定"按钮进入对应奖池首页。</p>
    <p>3. 抽奖道具直接发送到仓库，兑换币自动计数，奖励一览可查看可抽取道具及概率。</p>
    <p>4. 兑换商城可消耗熔岩兑换币兑换道具。</p>
    <p>5. 已加入BGM和音效，右侧可调节BGM音量。</p>
    <p>6. 在线链接易失效，永久文件版可咨询QQ。</p>
  </div>
</div>
<div class="disclaimer-box">
  ⚠️ 免责声明：本模拟器由玩家个人自制，完全免费，不得用于任何商业用途。各内容名称及形象归腾讯所有，不涉及任何真实充值或道具发放，如有侵权请联系QQ：3894801136删除。
</div>
<button class="fs-btn" id="fsBtn">⛶</button>
<div class="bgm-volume-control" id="bgmVolumeControl">
  <div class="bgm-volume-icon">🎵</div>
  <input type="range" class="bgm-volume-slider" id="bgmVolumeSlider" min="0" max="100" value="35">
</div>
<div class="stage" id="stage">
  <img class="bg-img" id="bgImg" src="../images/pool_select_bg.png" draggable="false" alt="">
  <img class="weapon-float" id="weaponFloat" src="../images/pool_weapon_float.png" draggable="false" alt="">
  <div class="gold-glow" id="goldGlow"></div>
  <div class="hit-layer" id="hitLayer"></div>
</div>

<script>
// ========== 武器中心点配置（相对于2340x1080） ==========
const WEAPON_CENTERS = {
  barrett: { x: 1354, y: 352, r: 200, name: '巴雷特-雷霆王者' },
  ak:      { x: 1273, y: 564, r: 180, name: 'AK47-雷霆王者' },
  feng:    { x: 755,  y: 558, r: 200, name: '雷霆王者之锋' },
  m12s:    { x: 1685, y: 572, r: 220, name: 'M12S-雷霆王者' },
  ting:    { x: 725,  y: 670, r: 320, name: '王者之霆' },
  cop:     { x: 1100, y: 605, r: 180, name: 'COP357-雷霆王者' },
  m4:      { x: 1591, y: 734, r: 280, name: 'M4A1-雷霆王者' }
};

// 确定按钮热区
const CONFIRM_BTN = { x: 800, y: 880, w: 740, h: 140 };

// ========== 音效 ==========
var clickAudioPool = [];
var backAudioPool = [];
var clickAudioIndex = 0;
var backAudioIndex = 0;
// 预加载音效
for(var i = 0; i < 3; i++){
  var ac = new Audio('../audio/gacha/click.m4a');
  ac.preload = 'auto';
  clickAudioPool.push(ac);
  var ab = new Audio('../audio/ui/back.m4a');
  ab.preload = 'auto';
  backAudioPool.push(ab);
}
function playClickSound(){
  try{
    var audio = clickAudioPool[clickAudioIndex];
    clickAudioIndex = (clickAudioIndex + 1) % clickAudioPool.length;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
function playBackSound(){
  try{
    var audio = backAudioPool[backAudioIndex];
    backAudioIndex = (backAudioIndex + 1) % backAudioPool.length;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}

// ========== 状态 ==========
let selectedPool = null;

// ========== 自适应缩放 ==========
function layout(){
  var s = Math.min(window.innerWidth/2340, window.innerHeight/1080);
  document.getElementById('stage').style.transform = 'scale('+s+')';
  document.getElementById('stage').style.left = (window.innerWidth - 2340*s)/2 + 'px';
  document.getElementById('stage').style.top = (window.innerHeight - 1080*s)/2 + 'px';
}
window.addEventListener('resize', layout);
layout();

// ========== 坐标转换 ==========
function getStageCoords(e){
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const scaleX = 2340 / rect.width;
  const scaleY = 1080 / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

// ========== 金色光晕 ==========
function showGoldGlow(poolId){
  const glow = document.getElementById('goldGlow');
  const center = WEAPON_CENTERS[poolId];
  const r = center.r * 1.3;
  glow.style.width = (r * 2) + 'px';
  glow.style.height = (r * 2) + 'px';
  glow.style.left = (center.x - r) + 'px';
  glow.style.top = (center.y - r) + 'px';
  glow.style.display = 'block';
}

function hideGoldGlow(){
  document.getElementById('goldGlow').style.display = 'none';
}

// ========== 获取点击位置对应的武器 ==========
function getWeaponAtPosition(x, y){
  let nearestPool = null;
  let nearestDist = Infinity;
  for (const poolId in WEAPON_CENTERS){
    const center = WEAPON_CENTERS[poolId];
    const dist = Math.sqrt((x - center.x) ** 2 + (y - center.y) ** 2);
    if (dist < center.r && dist < nearestDist){
      nearestDist = dist;
      nearestPool = poolId;
    }
  }
  return nearestPool;
}

// ========== 全屏按钮 ==========
document.getElementById('fsBtn').addEventListener('click', function(){
  // 通知父页面切换全屏
  window.parent.postMessage({type: 'toggleFullscreen'}, '*');
});

// ========== 音量调节 ==========
document.getElementById('bgmVolumeSlider').addEventListener('input', function(){
  var volume = parseInt(this.value) / 100;
  // 通知父页面调节音量
  window.parent.postMessage({type: 'setVolume', volume: volume}, '*');
});

// ========== 点击处理 ==========
document.getElementById('hitLayer').addEventListener('click', function(e){
  const pos = getStageCoords(e);
  
  // 先检查是否点了确定按钮
  if (pos.x >= CONFIRM_BTN.x && pos.x <= CONFIRM_BTN.x + CONFIRM_BTN.w &&
      pos.y >= CONFIRM_BTN.y && pos.y <= CONFIRM_BTN.y + CONFIRM_BTN.h){
    if (selectedPool){
      playBackSound(); // 确定按钮成功执行后播放back音效
      parent.postMessage({type:'poolSelected', poolId: selectedPool}, '*');
    }
    return;
  }
  
  // 检查是否点了武器
  const poolId = getWeaponAtPosition(pos.x, pos.y);
  if (poolId){
    playClickSound(); // 选中池子时播放点击音效
    selectedPool = poolId;
    showGoldGlow(poolId);
  }
});
</script>
</body>
</html>
